<body>
<div id="app"></div>
<div id="toast" class="haloHost" aria-live="polite"></div>
<script>
(function(){
  const root=document.getElementById('app');
  function showFailure(message){
    if(!root||(root.childNodes.length&&!root.querySelector('.ems-boot-surface')))return;
    console.error('EMS startup failure:',message);
    root.innerHTML=`<main role="alert" style="min-height:60vh;display:grid;place-items:center;padding:24px;background:#f3f7f6;color:#172538;font:15px/1.5 system-ui,sans-serif"><section style="width:min(560px,100%);padding:28px;border:1px solid #dce5eb;border-radius:18px;background:#fff;box-shadow:0 12px 36px #173d4b12;text-align:center"><h1 style="margin:0 0 8px;font-size:1.25rem">EMS could not finish starting</h1><pre id="emsBootReason" style="margin:12px 0 0;padding:12px;border-radius:9px;background:#f3f7f6;color:#425466;text-align:left;white-space:pre-wrap;overflow-wrap:anywhere;font:12px/1.45 ui-monospace,monospace"></pre><button id="emsBootReload" style="margin-top:18px;padding:9px 14px;border:0;border-radius:9px;background:#087f72;color:white;font-weight:700;cursor:pointer">Reload app</button></section></main>`;
    document.getElementById('emsBootReason').textContent=String(message||'Unknown startup error').slice(0,3000);
    document.getElementById('emsBootReload')?.addEventListener('click',()=>location.reload());
  }
  addEventListener('error',event=>{
    if(event.target?.tagName==='SCRIPT')showFailure(`Script load failed: ${event.target.src||'inline app script'}`);
    else if(event.error||event.message)showFailure(event.error?.stack||`${event.message||'Runtime error'}\n${event.filename||''}:${event.lineno||0}:${event.colno||0}`);
  },true);
  addEventListener('unhandledrejection',event=>{const reason=event.reason;showFailure(reason?.stack||reason?.message||String(reason||'Unhandled startup rejection'))});
  setTimeout(()=>showFailure('Startup is taking longer than expected. Check your connection and reload.'),15000);
})();
</script>
<script type="module" src="assets/js/app.js"></script>
</body>
</html>
