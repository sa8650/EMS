<!-- EMS head snippet — drop-in block for any companion site that shares this
     deployment's branding.

     Every URL below is root-absolute and points at a file that actually ships
     in this repo (assets/). The previous version referenced /favicon.ico,
     /icon-192.png and friends at the site root, where nothing is served, so a
     page that pasted it in got a broken icon and a manifest that failed to
     load. -->
<link rel="icon" href="/assets/favicon.ico" sizes="32x32">
<link rel="icon" type="image/svg+xml" href="/assets/favicon.svg">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/assets/favicon-16.png">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="manifest" href="/assets/site.webmanifest">
<meta name="theme-color" content="#0F766E">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
